<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spark Test</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      color: white;
      user-select: none;
    }
    .box {
      padding: 40px;
      border: 1px solid #334155;
      border-radius: 12px;
      background: #1e293b;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">Click anywhere on background or here</div>

  <script>
    (function() {
      // Test the spark logic
      window.addEventListener('click', function(e) {
        console.log('Clicked at', e.clientX, e.clientY);
      });
    })();
  </script>
</body>
</html>
